name: "Deploy"
description: "Deploys custom docker container"

inputs:
  service_id:
    description: "Name of service to deploy"
    required: true
  workdir:
    description: "Workdir"
    required: true
  compose_dir:
    description: "Compose dir"
    required: true
  branch_name:
    description: "Branch name"
    required: true
  repository:
    description: "Repository name"
    required: true
  repository_key:
    description: "Repository private key"
    required: true
  ssh_key:
    description: "SSH private key"
    required: true
  ssh_host:
    description: "SSH username"
    required: true
  ssh_user:
    description: "SSH password"
    required: true
  registry_host:
    description: "Image registry host e.g. ghcr.io"
    required: true
  registry_username:
    description: "Registry username"
    required: true
  registry_password:
    description: "Registry password"
    required: true
  token:
    description: "token password"
    required: true

runs:
  using: "composite"
  steps:

    - name: Configure SSH
      shell: bash
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/server.key
        chmod 600 ~/.ssh/server.key
        cat >>~/.ssh/config <<END
        Host server
          HostName $SSH_HOST
          User $SSH_USER
          IdentityFile ~/.ssh/server.key
          StrictHostKeyChecking no
        END
      env:
        SSH_KEY: ${{ inputs.ssh_key }}
        SSH_HOST: ${{ inputs.ssh_host }}
        SSH_USER: ${{ inputs.ssh_user }}

    - name: Deploy App
      shell: bash
      run: |
        ssh server << 'EOF'

          set -e

          echo "${{ inputs.registry_password }}" | docker login \
            ${{ inputs.registry_host }} \
            -u ${{ inputs.registry_username }} \
            --password-stdin


          if [ -d "${{ inputs.workdir }}/.git" ]; then

              echo "=== Repository exists. Pulling latest changes ==="

              cd ${{ inputs.workdir }}

              git checkout ${{ inputs.branch_name }}

              GIT_SSH_COMMAND='ssh -i /root/git -o IdentitiesOnly=yes' \
              git pull origin ${{ inputs.branch_name }}


          else

              echo "=== Repository not found. Cloning repository ==="

              GIT_SSH_COMMAND='ssh -i /root/git -o IdentitiesOnly=yes' \
              git clone \
              -b ${{ inputs.branch_name }} \
              git@github.com:Castle-Technology-Solutions/rate-my-estate-cms.git \
              ${{ inputs.workdir }}

              cd ${{ inputs.workdir }}

          fi


          echo "=== Checking docker compose ==="

          if [ -f "${{ inputs.workdir }}/${{ inputs.compose_dir }}" ]; then

              echo "Docker compose found"


              echo "=== Rebuilding services ==="

              docker compose \
                -f ${{ inputs.compose_dir }} \
                build


              echo "=== Restarting services ==="

              docker compose \
                -f ${{ inputs.compose_dir }} \
                up -d \
                --remove-orphans


              echo "=== Cleaning old images ==="

              docker image prune -f


              echo "=== Deployment finished ==="

              docker compose ps


          else

              echo "Docker compose file not found"
              exit 1

          fi


        EOF


      env:
        WORKDIR: ${{ inputs.workdir }}
        BRANCH_NAME: ${{ inputs.branch_name }}