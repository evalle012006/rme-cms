<div class="animated fadeIn">
  <div class="clearfix">
    <div class="float-right">
      <button class="btn btn-primary mb-2" routerLink="/property-category/add" type="button">Add</button>
    </div>
  </div>
</div>
<div class="card">
  <div class="card-body">
    <table datatable [dtOptions]="dtOptions" [dtTrigger]="dtTrigger"
           class="table table-hover w-100">
      <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Action</th>
      </tr>
      </thead>
      <tbody *ngIf="properties?.length != 0">
      <tr *ngFor="let person of properties">
        <td>{{ person.id }}</td>
        <td [innerHTML]="person.name">{{ person.name }}</td>
        <td>
          <button class="btn btn-sm btn-primary" routerLink="/property-category/edit/{{person.id}}" type="button">Edit</button>
<!--          <button class="btn btn-sm btn-danger" type="button" (click)="deleteModel(delete, person.id)">Delete</button>-->
        </td>
      </tr>
      </tbody>
      <tbody *ngIf="properties?.length == 0">
      <tr>
        <td colspan="3" class="no-data-available">No data!</td>
      </tr>
      <tbody>
    </table>
  </div>
</div>

<ng-template #delete>
  <div class="modal-body modal-body-txt text-center">
    <div class="center img-center">
      <img src="../../../../assets/img/avatars/cancel.jpg" class="img-avatar" alt="admin@bootstrapmaster.com"/>
    </div>
    <h4 class="modal-title title-center">Delete?</h4>
    <p class="caption-txt">Do you really want to delete these records?</p>
  </div>
  <div class="modal-footer modal-footer-buttons">
    <button class="modal-cancel-button btn-danger" type="button" (click)="closeModel()">Cancel</button>
    <button class="modal-delete-button btn-success" type="button" (click)="deleteProperty()">Delete</button>
  </div>
</ng-template>
