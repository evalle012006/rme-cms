<app-header
  [navbarBrandRouterLink]="['/dashboard']" [fixed]="true"
  [navbarBrandFull]="{src: 'assets/img/brand/logo.png',width: 140,height: 30,alt: 'Logo' }"
  [navbarBrandMinimized]="{src: 'assets/img/brand/sygnet.png',width: 30,height: 30,alt: 'Logo'}"
  [sidebarToggler]="'lg'" [asideMenuToggler]="false" [mobileAsideMenuToggler]="false">
  <ul class="nav navbar-nav ml-auto pr-lg-3">
    <li class="nav-item dropdown" dropdown placement="bottom right">
      <a class="nav-link cursor-pointer" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="false"
         dropdownToggle>
        <img [src]="(user && user.full_profile_image) ? user.full_profile_image :'assets/img/avatars/7.jpg'"
             class="img-avatar"/>
      </a>
      <div class="dropdown-menu dropdown-menu-right" *dropdownMenu aria-labelledby="simple-dropdown">
        <div class="dropdown-header text-center"><strong>Account</strong></div>
        <div class="divider"></div>
        <span class="dropdown-item cursor-pointer" [routerLink]="['/','setting','profile']"><i class="fa fa-user"></i> Profile</span>
        <span class="dropdown-item cursor-pointer" (click)="logout()"><i class="fa fa-lock"></i> Logout</span>
      </div>
    </li>
  </ul>
</app-header>
<div class="app-body">
  <app-sidebar [fixed]="true" [display]="'lg'" [minimized]="minimized" #sidebar
               (minimizedChange)="toggleMinimize($event)">
    <app-sidebar-nav [navItems]="navItems" [perfectScrollbar] [disabled]="sidebar.minimized"></app-sidebar-nav>
    <app-sidebar-minimizer></app-sidebar-minimizer>
  </app-sidebar>
  <main class="main">
    <cui-breadcrumb></cui-breadcrumb>
    <div class="container-fluid">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
<app-footer>
  <span class="ml-auto"><a href="#">Rate My Estate</a> &copy; 2019.</span>
</app-footer>
