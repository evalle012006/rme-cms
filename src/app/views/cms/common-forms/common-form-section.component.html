<form
  [formGroup]="commonForm"
  novalidate
  (ngSubmit)="save()"
  autocomplete="off"
>
  <div class="card">
    <div class="card-header">
      <strong>{{ sectionName ? sectionName + ' section' : '' }}</strong>
      <div class="card-header-actions">
        <button class="btn btn-primary" type="submit">save</button>
      </div>
    </div>
    <div class="card-body">
      <div class="row">
        <div class="col-md-4" *ngIf="commonForm.get('image')">
          <label>Banner Image</label>
          <app-single-dropzone
            [placeHolderText]="'Click Or Drag Image to upload!'"
            [onDragText]="'Drop Image to upload!'"
            [control]="commonForm.get('image')"
            [path]="
              formData && formData['image']
                ? imageUrl + formData['image']
                : null
            "
          >
          </app-single-dropzone>
        </div>
        <app-form-input-text
          class="col-md-8"
          [label]="'Title'"
          [control]="commonForm.get('title')"
          [validationMessage]="'Title is required'"
          *ngIf="commonForm.get('title')"
        >
        </app-form-input-text>

        <div class="col-md-12" *ngIf="commonForm.get('body')">
          <label>Description</label>
          <app-form-input-ck-editor
            class="col-md-12"
            [control]="commonForm.get('body')"
            [validationMessage]="'Description is required'"
          >
          </app-form-input-ck-editor>
        </div>
      </div>
    </div>
  </div>
</form>
