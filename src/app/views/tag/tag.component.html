<div class="animated fadeIn">
  <div class="d-flex justify-content-end mb-2">
    <button class="btn btn-primary" (click)="openAddModal()">Add</button>
  </div>
  <div class="card">
    <div class="card-body">
      <table datatable [dtOptions]="dtOptions" [dtTrigger]="dtTrigger" class="table table-hover w-100">
        <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Type</th>
          <th>Action</th>
        </tr>
        </thead>
        <tbody *ngIf="tags?.length != 0">
        <tr *ngFor="let tag of tags">
          <td>{{ tag.id }}</td>
          <td>{{ tag.name }}</td>
          <td>{{ tag.type }}</td>
          <td>
            <button class="btn btn-sm btn-primary" (click)="openEditModal(tag)">Edit</button>
          </td>
        </tr>
        </tbody>
        <tbody *ngIf="tags?.length == 0">
        <tr>
          <td colspan="4" class="no-data-available">No data!</td>
        </tr>
        <tbody>
      </table>
    </div>
  </div>
</div>
