version: "3.8"

services:

  ####################################################
  # Laravel PHP
  ####################################################
  php:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: rme_php

    restart: unless-stopped

    working_dir: /var/www/backend

    volumes:
      - ./backend:/var/www/backend
      - vendor:/var/www/backend/vendor

    depends_on:
      - mysql

    networks:
      - rme_internal

  ####################################################
  # Angular Builder
  ####################################################
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile

    container_name: rme_admin

    restart: "no"

    volumes:
      - admin_build:/app/dist

    networks:
      - rme_internal

  ####################################################
  # React/Vite Builder
  ####################################################
  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile

    container_name: rme_cms

    restart: "no"

    volumes:
      - cms_build:/usr/share/nginx/html
    networks:
      - rme_internal

  ####################################################
  # Nginx
  ####################################################
  nginx:
    image: nginx:alpine

    container_name: rme_nginx

    restart: unless-stopped

    depends_on:
      - php
      - admin
      - cms

    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"

    volumes:
      - ./backend:/var/www/backend

      # Angular production build
      - admin_build:/var/www/admin

      # React production build
      - cms_build:/var/www/cms

      # nginx config
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    networks:
      - rme_internal

  ####################################################
  # MySQL
  ####################################################
  mysql:
    image: mysql:5.7

    platform: linux/amd64

    container_name: rme_mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - rme_internal

####################################################
# Networks
####################################################
networks:
  rme_internal:
    driver: bridge

####################################################
# Volumes
####################################################
volumes:
  mysql_data:
  vendor:
  admin_build:
  cms_build:
