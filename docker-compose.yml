version: '3.8'

services:

  # -------------------------------------------------------------------------
  # PHP-FPM — runs the Laravel backend
  # -------------------------------------------------------------------------
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: rme_php
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
      - rme_vendor:/var/www/backend/vendor   # isolated vendor volume
    networks:
      - rme_internal
    depends_on:
      - mysql

  # -------------------------------------------------------------------------
  # Nginx — serves both the Laravel app (port 8000) and Angular admin (port 8001)
  # -------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: rme_nginx
    restart: unless-stopped
    ports:
      - "8000:8000"   # Laravel public site → ratemyestate.castledigital.com.au
      - "8001:8001"   # Angular admin SPA  → ratemyestatecms.castledigital.com.au
    volumes:
      - ./backend:/var/www/backend
      - ./backend/public/admin:/var/www/admin   # compiled Angular build
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - rme_internal
    depends_on:
      - php

  # -------------------------------------------------------------------------
  # MySQL — single shared database
  # -------------------------------------------------------------------------
  mysql:
    image: mysql:5.7
    container_name: rme_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - rme_mysql_data:/var/lib/mysql
    networks:
      - rme_internal
    ports:
      - "3307:3306"   # exposed on 3307 to avoid conflict with any host MySQL

networks:
  rme_internal:
    driver: bridge

volumes:
  rme_mysql_data:
  rme_vendor:
