# =============================================================================
# RateMyEstate — Nginx Configuration (Production)
#   Port 8000 → Laravel public site  → pre.ratemyestate.com
#   Port 8001 → React CMS SPA        → pre-admin.ratemyestate.com
# =============================================================================

server {
    listen 8000;
    server_name _;

    root /var/www/backend/public;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /storage/ {
        alias /var/www/backend/storage/app/public/;
        try_files $uri 404;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    client_max_body_size 50M;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
}

server {
    listen 8001;
    server_name _;

    root /var/www/backend/public/cms;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}