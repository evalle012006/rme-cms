# =============================================================================
# RateMyEstate — Nginx Configuration
# Serves two virtual hosts from one container:
#   Port 8000 → Laravel public site (PHP-FPM)
#   Port 8001 → Angular admin SPA (static files)
# =============================================================================

# -----------------------------------------------------------------------
# Server 1: Laravel public site on port 8000
# → https://ratemyestate.castledigital.com.au
# -----------------------------------------------------------------------
server {
    listen 8000;
    server_name _;

    root /var/www/backend/public;
    index index.php index.html;

    # Handle Laravel routes — send everything to index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP requests to PHP-FPM
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Security — deny access to hidden files
    location ~ /\. {
        deny all;
    }

    client_max_body_size 50M;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
}

# -----------------------------------------------------------------------
# Server 2: Angular admin SPA on port 8001
# → https://ratemyestatecms.castledigital.com.au
# -----------------------------------------------------------------------
server {
    listen 8001;
    server_name _;

    root /var/www/admin;
    index index.html;

    # All routes fall back to index.html (Angular handles routing client-side)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively — Angular hashes filenames on build
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Security — deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
