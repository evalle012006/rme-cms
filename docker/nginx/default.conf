# =============================================================================
# RateMyEstate — Nginx Configuration
# Serves three virtual hosts from one container:
#   Port 8000 → Laravel public site (PHP-FPM)
#   Port 8001 → Angular admin SPA  (legacy — preserved during React migration)
#   Port 8002 → React admin SPA    (new build)
# =============================================================================

# -----------------------------------------------------------------------
# Server 1: Laravel public site on port 8000
# → https://ratemyestate.castledigital.com.au
# -----------------------------------------------------------------------
server {
    listen 8000;
    server_name _;

    root /var/www/backend/public;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    client_max_body_size 50M;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
}

# -----------------------------------------------------------------------
# Server 2: Angular admin SPA on port 8001  (LEGACY — do not modify)
# → https://ratemyestatecms.castledigital.com.au
# Kept live until React migration is complete and signed off by client.
# -----------------------------------------------------------------------
server {
    listen 8001;
    server_name _;

    root /var/www/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}

# -----------------------------------------------------------------------
# Server 3: React admin SPA on port 8002  (NEW — migration target)
# → https://ratemyestatecms-react.castledigital.com.au
# Remove this block (and port 8002 in docker-compose) once Angular is
# decommissioned and the React build is promoted to port 8001.
# -----------------------------------------------------------------------
server {
    listen 8002;
    server_name _;

    root /var/www/cms;
    index index.html;

    # React Router — all paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite hashes asset filenames — safe to cache aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}